apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cicd-modernization-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ShivaKrishna4808/cicd-modernization-eks.git
    targetRevision: main
    path: kubernetes/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: cicd-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true