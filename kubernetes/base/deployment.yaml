apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-modernization-demo
  labels:
    app: cicd-modernization-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cicd-modernization-demo

  template:
    metadata:
      labels:
        app: cicd-modernization-demo

    spec:
      containers:
        - name: app
          image: cicd-modernization-demo:placeholder

          ports:
            - containerPort: 8080

          env:
            - name: APP_VERSION
              value: "1.0.0"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
